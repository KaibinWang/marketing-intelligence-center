<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}营销情报中心{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-rc7/dist/css/adminlte.min.css">
    <style>
        body { font-size: 14px; }
        .content-wrapper > .content { padding-top: 0; }
        .table th { white-space: nowrap; }
        .pagination-info { font-size: 13px; color: #6c757d; margin: 0.5rem 0; }
        .filter-form .form-label { font-size: 13px; margin-bottom: 2px; }
        .filter-form .form-control,
        .filter-form .form-select { font-size: 13px; }
        .status-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
        .status-new { background: #fff3cd; color: #856404; }
        .status-sent { background: #d4edda; color: #155724; }
        .status-success { background: #d4edda; color: #155724; }
        .status-failed { background: #f8d7da; color: #721c24; }
        .suggestion-box {
            background: #e8f4fd; border-left: 4px solid #1a73e8;
            padding: 1rem; border-radius: 0 4px 4px 0; white-space: pre-wrap;
        }
        .scrollable-text {
            max-height: 300px; overflow-y: auto; background: #f8f9fa;
            border: 1px solid #dee2e6; padding: 0.75rem;
            border-radius: 4px; font-size: 13px; white-space: pre-wrap;
        }
        .brand-link .brand-text { font-weight: 600; }
    </style>
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

    <!-- Navbar -->
    <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" data-widget="pushmenu" href="#" role="button">
                    <i class="fas fa-bars"></i>
                </a>
            </li>
        </ul>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item">
                <span class="nav-link">
                    <i class="far fa-bell me-1"></i> 营销情报中心
                </span>
            </li>
        </ul>
    </nav>

    <!-- Sidebar -->
    <aside class="main-sidebar sidebar-dark-primary elevation-4">
        <a href="/" class="brand-link">
            <span class="brand-text">营销情报中心</span>
        </a>
        <div class="sidebar">
            <nav class="mt-2">
                <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu">
                    <li class="nav-item">
                        <a href="/" class="nav-link {% if page == 'index' %}active{% endif %}">
                            <i class="nav-icon fas fa-list"></i>
                            <p>情报列表</p>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/stats" class="nav-link {% if page == 'stats' %}active{% endif %}">
                            <i class="nav-icon fas fa-chart-bar"></i>
                            <p>统计看板</p>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/sources" class="nav-link {% if page == 'sources' %}active{% endif %}">
                            <i class="nav-icon fas fa-database"></i>
                            <p>数据源管理</p>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/pipeline" class="nav-link {% if page == 'pipeline' %}active{% endif %}">
                            <i class="nav-icon fas fa-play-circle"></i>
                            <p>完整采集</p>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/push-logs" class="nav-link {% if page == 'push-logs' %}active{% endif %}">
                            <i class="nav-icon fas fa-paper-plane"></i>
                            <p>推送记录</p>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/settings" class="nav-link {% if page == 'settings' %}active{% endif %}">
                            <i class="nav-icon fas fa-cog"></i>
                            <p>过滤设置</p>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </aside>

    <!-- Content Wrapper -->
    <div class="content-wrapper">
        <section class="content-header">
            <div class="container-fluid">
                <div class="row mb-2">
                    <div class="col-sm-6">
                        <h1 class="m-0">{% block page_title %}{% endblock %}</h1>
                    </div>
                </div>
            </div>
        </section>
        <section class="content">
            <div class="container-fluid">
                {% block content %}{% endblock %}
            </div>
        </section>
    </div>

    <footer class="main-footer">
        <strong>营销情报中心</strong>
        <div class="float-right d-none d-sm-inline">
            <small>v1.0</small>
        </div>
    </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-rc7/dist/js/adminlte.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
